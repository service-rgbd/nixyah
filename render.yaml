services:
  - type: web
    name: nixyah
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workerspace/api-server build
    startCommand: pnpm --filter @workerspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://www.nixyah.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SECRET_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SUPPORT_TELEGRAM_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: R2_ACCOUNT_ID
        value: 90b110d9c9e7d9671f85ac48fe800e61
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: djantrah
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-c4d2f077b8bf4164a9ecdea6a7d140c1.r2.dev
      - key: R2_ENDPOINT
        value: https://90b110d9c9e7d9671f85ac48fe800e61.r2.cloudflarestorage.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://www.nixyah.com,https://nixyah.onrender.com