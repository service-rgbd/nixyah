services:
  - type: web
    name: ivory-diaspora-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: API_PUBLIC_URL
        value: https://api.nixyah.com/api
      - key: EXPO_PUBLIC_API_URL
        value: https://api.nixyah.com/api
      - key: EXPO_PUBLIC_APP_URL
        value: nixyah://
      - key: R2_PUBLIC_BASE_URL
        value: https://media.nixyah.com

  - type: static
    name: ivory-diaspora-admin-web
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/admin-web build
    staticPublishPath: artifacts/admin-web/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BASE_PATH
        value: /
      - key: VITE_API_BASE_URL
        value: https://api.nixyah.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
